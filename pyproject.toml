[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entropica"
version = "0.1.0"
description = "GPU-accelerated information-theoretic estimators for Python."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

authors = [
    { name = "Gabriel Genest" },
]

keywords = [
    "information theory",
    "mutual information",
    "entropy",
    "GPU",
    "CUDA",
    "statistics",
]

dependencies = [
    "numpy>=2.0",
    "cupy-cuda13x>=14.0",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/<username>/entropica"
Repository = "https://github.com/<username>/entropica"
Issues = "https://github.com/<username>/entropica/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/entropica"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
